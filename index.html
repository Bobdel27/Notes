<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes Tâches</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tâches"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#2456d6"><link rel="apple-touch-icon" id="ati">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#eee4cf;--side:#f3ead6;--board:#f8f1e0;--card:#fcf7ea;--ink:#2b2418;--ink-2:#6b6253;--line:#e0d3b3;--accent:#2456d6;--accent-ink:#ffffff;--accent-soft:#e2eaff;--danger:#b4261f;--warn:#9a6200;--shadow:0 1px 2px rgba(20,35,50,.08),0 4px 14px rgba(20,35,50,.10);--font-display:'Space Grotesk','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202a36;--side:#2a3644;--board:#3b4959;--card:#354354;--ink:#eef2f6;--ink-2:#b6c1cd;--line:#4c5c6e;--accent:#6c93ff;--accent-ink:#0b1220;--accent-soft:#33487a;--danger:#ff8a82;--warn:#f0c36a;--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#202a36;--side:#2a3644;--board:#3b4959;--card:#354354;--ink:#eef2f6;--ink-2:#b6c1cd;--line:#4c5c6e;--accent:#6c93ff;--accent-ink:#0b1220;--accent-soft:#33487a;--danger:#ff8a82;--warn:#f0c36a;--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
[hidden]:not([hidden=until-found i]){display:none!important}
html{height:100%;font-size:clamp(15px,.55vw + 11px,26px);-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.5;overflow:hidden;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
button,input,textarea,select{font:inherit;color:inherit;max-width:100%}
input,textarea,select{font-size:max(16px,1em)}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin:0;flex:none;cursor:pointer}
input[type=date]{min-height:1.6em;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}
.rem{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#ffe4cc;color:#2b2418;border:1px solid var(--line);border-radius:10px;font-size:.92rem}
.rem span{flex:1;min-width:0}
.rem button{background:transparent;border:0;font-size:1.3rem;line-height:1;padding:4px 8px;min-height:36px}

/* Gauche : tableau de fiches (2 colonnes max) — Droite : rédaction */
.app{flex:1;min-height:0;display:grid;background:var(--board);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  grid-template-columns:minmax(0,1fr) clamp(300px,32vw,640px);grid-template-rows:minmax(0,1fr);grid-template-areas:"board write"}
.boardp{grid-area:board;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--side);border-right:1px solid var(--line)}
.writep{grid-area:write;min-width:0;min-height:0;overflow-y:auto;background:var(--card);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.bnav{display:none}

.lh{padding:8px 14px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:var(--side)}
.lh-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#fsel{flex:0 1 12rem;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 8px;min-height:40px;font-weight:600}
.lh-top .search{flex:1 1 8rem;width:auto;min-width:0;min-height:40px}
.lh-top .h1in{flex:0 1 12rem;width:auto;min-height:40px}
.lh h1{flex:1;min-width:0;margin:0;font-family:var(--font-display);font-size:1.3rem;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h1in{font:inherit;letter-spacing:inherit;color:inherit;background:var(--card);border:1px solid var(--accent);border-radius:8px;padding:2px 8px;width:100%}
.cnt{color:var(--ink-2);font-size:.8rem;margin-top:-4px}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.search::placeholder{color:var(--ink-2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.fo{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;min-height:38px;white-space:nowrap}
.fo:hover{background:var(--accent-soft)}
.fo.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fo .ct{font-size:.78rem;font-weight:500;opacity:.75}
.fo.add{color:var(--accent);border-style:dashed}
.lh-opts{display:flex;gap:8px;flex-wrap:wrap}
.lh-opts select{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 8px;min-height:38px}

/* Tableau de fiches */
.board{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;gap:14px;align-items:flex-start}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.none{color:var(--ink-2);text-align:center;padding:40px 16px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.card[data-c]:not([data-c=""]),.writep[data-c]:not([data-c=""]){--ink:#2b2418;--ink-2:#6b6253;--line:#e8dcbc;--card:rgba(255,255,255,.55);color:var(--ink)}
.card[data-c="yellow"],.writep[data-c="yellow"]{background:#ffec99}.card[data-c="green"],.writep[data-c="green"]{background:#c8ecd4}.card[data-c="blue"],.writep[data-c="blue"]{background:#c7dcff}.card[data-c="pink"],.writep[data-c="pink"]{background:#fbcddb}.card[data-c="orange"],.writep[data-c="orange"]{background:#ffd7ae}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:var(--shadow)}}
.c-head{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:0;padding:12px 14px;min-height:48px}
.ttl{flex:1;min-width:0;font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.pin .c-head::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.card.done .ttl{text-decoration:line-through;color:var(--ink-2)}
.card.late .ttl{color:var(--danger)}
.chev{flex:none;color:var(--ink-2);transition:transform .15s}
.card.open .chev{font-size:1.1rem}
.grip{flex:none;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;padding:8px 8px;margin:-8px 0 -8px -8px;color:var(--ink-2);font-size:1.15rem;line-height:1}
.card.dragging{position:relative;z-index:40;opacity:.92;box-shadow:0 10px 28px rgba(0,0,0,.3);transition:none}
.card.dropto{outline:3px solid var(--accent);outline-offset:2px}
#bk{background:#dbe7ff}
.rem .btn{background:var(--b);border:1px solid var(--b);font-size:.9rem;padding:4px 12px;min-height:36px}
.links{display:flex;flex-direction:column;gap:4px}
.links a{color:var(--accent);font-weight:600;overflow-wrap:anywhere;text-decoration:underline;min-height:28px;display:block}
.card[data-c]:not([data-c=""]) .links a{color:#1a3fa8}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{background:var(--card);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:4px 2px;min-height:36px;font-weight:600;font-size:.8rem;overflow-wrap:anywhere;text-align:center;line-height:1.2}
.tab .ct{display:inline;margin-left:3px;font-size:.72rem;font-weight:500;opacity:.75}
.btn.sm{min-height:36px;padding:4px 10px}
.lh-top .tabs{flex:1;min-width:0}
#undo{margin-left:auto}
.tab{--tc:#6b7a8c;background:var(--tc);border-color:var(--tc);color:#fff;filter:brightness(1.12) saturate(1.15);box-shadow:0 0 8px color-mix(in srgb,var(--tc) 65%,transparent)}
.tab.on{filter:brightness(1.3) saturate(1.3);box-shadow:0 0 0 2px #fff,0 0 18px var(--tc),0 0 6px var(--tc)}
.tab:active{filter:brightness(1.6) saturate(1.4);box-shadow:0 0 0 3px #fff,0 0 26px var(--tc),0 0 10px var(--tc)}
.tab[data-b="todo"]{--tc:#e8710a}.tab[data-b="soon"]{--tc:#2456d6}.tab[data-b="urgent"]{--tc:#c62828}.tab[data-b="done"]{--tc:#17307a}.tab[data-b="misc"]{--tc:#b8860b}
.c-box,.w-box{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 8px;min-height:38px;min-width:0;max-width:100%}
.c-detail{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px;border-top:1px solid var(--line);padding-top:10px}
.c-title{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 0 8px;font-family:var(--font-display);font-size:1.1rem;font-weight:700}
.c-text{width:100%;min-height:5rem;resize:none;overflow:hidden;border:0;background:transparent;padding:0;line-height:1.6;font-size:.98rem}
.c-title:focus-visible,.c-text:focus-visible,.i-text:focus-visible,.i-add:focus-visible,.w-title:focus-visible,.w-body:focus-visible{outline:none}
.card.done .c-title,.card.done .c-text{text-decoration:line-through;color:var(--ink-2)}
.it{display:flex;align-items:center;gap:10px;min-height:2.2rem}
.i-text,.i-add{flex:1;min-width:0;border:0;background:transparent;padding:6px 0}
.i-add{border-top:1px dashed var(--line);padding-top:10px}
.it.is-done .i-text{text-decoration:line-through;color:var(--ink-2)}
.i-rm{flex:none;background:transparent;border:0;color:var(--ink-2);padding:0 8px;font-size:1.2rem;line-height:1;border-radius:6px;min-height:36px}
.i-rm:hover{color:var(--danger)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;font-size:.88rem;color:var(--ink-2)}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.due{display:inline-flex;align-items:center;gap:6px}
.due.late{color:var(--danger);font-weight:600}.due.now{color:var(--warn);font-weight:600}
.c-due,.w-due{background:transparent;border:0;padding:0;color:inherit;min-width:0;font-family:inherit}
.pal{display:flex;gap:10px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--ink-2);padding:0;color:var(--ink-2);font-size:.9rem;line-height:1}
.sw[data-c=""]{background:#fcf7ea}.sw[data-c="yellow"]{background:#ffec99}.sw[data-c="green"]{background:#c8ecd4}.sw[data-c="blue"]{background:#c7dcff}.sw[data-c="pink"]{background:#fbcddb}.sw[data-c="orange"]{background:#ffd7ae}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.c-fold,.w-fold{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 8px;min-height:38px;min-width:0;max-width:100%}
.grow{flex:1}
.c-pin{--b:#6b7a8c}.c-pin[aria-pressed="true"]{--b:var(--accent)}.c-pin[aria-pressed="true"] svg{fill:currentColor}
.t-body{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}

/* Rédaction */
.writep h2{margin:0;font-family:var(--font-display);font-size:1.15rem}
.w-title{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 0 10px;font-family:var(--font-display);font-size:1.5rem;font-weight:700}
.w-body{width:100%;min-height:10rem;resize:none;overflow:hidden;border:0;background:transparent;padding:0;line-height:1.7;font-size:1rem}
.w-title::placeholder,.w-body::placeholder,.i-add::placeholder,.c-title::placeholder,.c-text::placeholder{color:var(--ink-2);opacity:.7}
.w-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.w-actions .btn:first-child{flex:1}

/* Boutons */
.btn{--b:var(--accent);display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--b);border:1px solid var(--b);color:var(--accent-ink);border-radius:9px;padding:8px 14px;font-weight:600;min-height:40px;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ic{padding:8px 12px}
.btn.red{--b:#c62828;color:#fff}.btn.green{--b:#1f8a4c;color:#fff}.btn.orange{--b:#e8710a;color:#fff}.btn.sure{--b:#7f1414;color:#fff}.btn.gray{--b:#6b7a8c;color:#fff}
.btn:active:not(:disabled),.lit{filter:brightness(1.4) saturate(1.2)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--b) 35%,transparent),0 0 14px var(--b)!important}
.btn svg{width:15px;height:15px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:14rem;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:6px}
.menu .btn{justify-content:flex-start}

/* Téléphone : Fiches / Rédiger */
@media (max-width:699px){
  html,body{height:100dvh}
  body{padding:0}
  .shell{gap:0}
  .rem{border-radius:0}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"main" "nav";border:0;border-radius:0}
  .boardp,.writep{grid-area:main}
  .app[data-pane="board"] .writep{display:none}
  .app[data-pane="write"] .boardp{display:none}
  .boardp{border-right:0}
  .bnav{grid-area:nav;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px max(12px,env(safe-area-inset-left,0px));background:var(--side);border-top:1px solid var(--line)}
  .bnav .btn{--b:#6b7a8c;color:#fff;min-height:46px}
  .bnav .btn.on{--b:var(--accent);color:var(--accent-ink)}
  .lh,.board{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .writep{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (hover:none){.i-rm{min-width:40px}.sw{width:30px;height:30px}}
@media (prefers-reduced-motion:no-preference){.fo,.btn{transition:background-color .15s,border-color .15s,filter .15s}}
</style></head>
<body>
<div class="shell">
  <div class="rem" id="bk" hidden><span id="bktxt"></span><button type="button" class="btn orange" id="bkgo">Exporter</button><button type="button" id="bkx" aria-label="Fermer">×</button></div>
  <div class="rem" id="rem" hidden><span id="remtxt"></span><button type="button" id="remx" aria-label="Fermer">×</button></div>
  <div class="app" id="app" data-pane="board">
    <section class="boardp" aria-label="Tableau de fiches">
      <header class="lh">
        <div hidden>
          <select id="fsel" aria-label="Pochette"></select>
          <input id="fname" type="text" aria-label="Nom de la pochette">
          <input id="q" type="search" aria-label="Rechercher une fiche">
          <select id="sort"><option value="manual">Par défaut</option></select>
          <select id="flt"><option value="all">Toutes</option></select>
        </div>
        <div class="lh-top">
          <div class="tabs" id="tabs" role="tablist" aria-label="Casiers"></div>
          <button class="btn ic sm" id="undo" type="button" disabled aria-label="Annuler">↶</button>
          <div class="menuwrap">
            <button class="btn ic sm" id="mbtn" type="button" aria-label="Menu" aria-haspopup="true">⋯</button>
            <div class="menu" id="menu" hidden>
              <button class="btn" id="mRn" type="button" hidden>Renommer la pochette</button>
              <button class="btn red" id="mDel" type="button" hidden>Supprimer la pochette</button>
              <button class="btn red" id="mTr" type="button">🗑 Corbeille</button>
              <button class="btn" id="rmd" type="button">🔔 Rappels</button>
              <button class="btn orange" id="exp" type="button">Exporter</button>
              <button class="btn green" id="imp" type="button">Importer</button>
              <button class="btn red" id="empty" type="button" hidden>Vider la corbeille</button>
            </div>
          </div>
        </div>
      </header>
      <div class="board" id="board"></div>
    </section>
    <section class="writep" id="writep" data-c="" aria-label="Rédaction">
      <h2>Nouvelle fiche</h2>
      <input class="w-title" id="wTitle" type="text" placeholder="Titre" aria-label="Titre">
      <textarea class="w-body" id="wBody" placeholder="Ce que j'ai à faire…" aria-label="Contenu"></textarea>
      <div id="wItems"></div>
      <input class="i-add" id="wAdd" type="text" placeholder="+ Ajouter une étape" aria-label="Ajouter une étape">
      <div class="row"><label class="due">Échéance <input type="date" class="w-due" id="wDue"></label><button type="button" class="btn ic sm" id="wDueClr" aria-label="Effacer l'échéance">✕</button></div>
      <div class="row"><span>Casier</span><select class="w-box" id="wBox" aria-label="Casier"></select></div>
      <div class="row" hidden><span>Pochette</span><select class="w-fold" id="wFold" aria-label="Pochette"></select></div>
      <div class="row"><span>Couleur</span><div class="pal" id="wPal" role="group" aria-label="Couleur"></div></div>
      <div class="w-actions">
        <button class="btn" id="wSave" type="button">Ajouter à mes fiches</button>
        <button class="btn gray" id="wClear" type="button">Effacer</button>
      </div>
    </section>
    <nav class="bnav" aria-label="Navigation">
      <button class="btn on" id="nB" type="button">Fiches</button>
      <button class="btn" id="nW" type="button">✎ Rédiger</button>
    </nav>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</div>

<script>
(function () {
  var KEY = 'mes-notes-v2', DKEY = 'mes-notes-draft';
  var COLORS = [['', 'Aucune couleur'], ['yellow', 'Jaune'], ['green', 'Vert'], ['blue', 'Bleu'], ['pink', 'Rose'], ['orange', 'Orange']];
  var BOXES = [['todo', 'À faire'], ['soon', 'À venir'], ['urgent', 'Urgent'], ['done', 'À chercher'], ['misc', 'Divers']];
  var state = { box: 'todo', notes: [], folders: [], sel: '', editF: '', q: '', sort: 'manual', flt: 'all', open: {}, pane: 'board', flash: '' };
  var draft = { title: '', body: '', due: '', color: '', folder: '', box: 'todo', items: [] };
  var $ = function (id) { return document.getElementById(id); };

  function uid() { return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function short(iso) { var p = (iso || '').split('-'); if (p.length !== 3) return ''; return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }
  function find(id) { return state.notes.filter(function (n) { return n.id === id; })[0]; }
  function item(n, id) { return n.items.filter(function (i) { return i.id === id; })[0]; }
  function fold(id) { return state.folders.filter(function (f) { return f.id === id; })[0]; }
  function curF() { return fold(state.sel); }
  function fixF() { state.notes.forEach(function (n) { if (n.folder && !fold(n.folder)) n.folder = ''; }); if (draft.folder && !fold(draft.folder)) draft.folder = ''; }
  function fit(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

  function norm(n) {
    var bx = ['todo', 'soon', 'urgent', 'done', 'misc'].indexOf(n.box) >= 0 ? n.box : 'todo';
    return { id: n.id || uid(), title: n.title || '', body: n.body || '', date: n.date || today(), due: n.due || '', color: n.color || '', pinned: !!n.pinned, autoU: !!n.autoU, box: bx, done: false, items: Array.isArray(n.items) ? n.items : [], trashed: !!n.trashed, folder: n.folder || '' };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.notes)) {
          state.notes = d.notes.map(norm);

        clearTimeout(delTimer);
        delTimer = setTimeout(function () { dl.classList.remove('sure'); dl.textContent = 'Supprimer'; }, 3500);
      }
      return;
    }
    var sw = t.closest('.sw');
    if (sw) {
      snap(); n.color = sw.getAttribute('data-c'); card.setAttribute('data-c', n.color);
      card.querySelectorAll('.sw').forEach(function (s) { s.setAttribute('aria-pressed', String(s === sw)); });
      save(); return;
    }
    var rm = t.closest('.i-rm');
    if (rm) {
      var id = rm.closest('.it').getAttribute('data-i');
      snap(); n.items = n.items.filter(function (i) { return i.id !== id; });
      card.querySelector('.items').innerHTML = itemsHTML(n); updateMeta(card, n); save(); return;
    }
    if (t.closest('.restore')) { snap(); n.trashed = false; delete state.open[n.id]; save(); renderAll(); return; }
    var pg = t.closest('.purge');
    if (pg) {
      if (pg.classList.contains('sure')) {
        clearTimeout(purgeTimer); snap();
        state.notes = state.notes.filter(function (x) { return x.id !== n.id; });
        save(); renderAll();
      } else {
        pg.classList.add('sure'); pg.textContent = 'Confirmer';
        clearTimeout(purgeTimer);
        purgeTimer = setTimeout(function () { pg.classList.remove('sure'); pg.textContent = 'Supprimer définitivement'; }, 3500);
      }
    }
  });
  board.addEventListener('focusout', function () { typing = false; });

  /* Glisser-déposer */
  var drag = null, suppress = false;
  board.addEventListener('pointerdown', function (e) {
    var g = e.target.closest('.grip'); if (!g) return;
    var card = g.closest('.card'), n = card && find(card.getAttribute('data-id')); if (!n || n.trashed) return;
    e.preventDefault();
    drag = { card: card, n: n, x: e.clientX, y: e.clientY, over: null, moved: false, id: e.pointerId };
    try { g.setPointerCapture(e.pointerId); } catch (x) {}
    card.classList.add('dragging');
  });
  board.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
    drag.moved = true;
    drag.card.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    var br = board.getBoundingClientRect();
    if (e.clientY < br.top + 40) board.scrollTop -= 12; else if (e.clientY > br.bottom - 40) board.scrollTop += 12;
    if (drag.over) drag.over.classList.remove('dropto');
    drag.over = null;
    var els = document.elementsFromPoint(e.clientX, e.clientY);
    for (var i = 0; i < els.length; i++) {
      var oc = els[i].closest && els[i].closest('.card');
      if (oc && oc !== drag.card) {
        var o = find(oc.getAttribute('data-id'));
        if (o && !o.trashed && o.pinned === drag.n.pinned) { drag.over = oc; oc.classList.add('dropto'); }
        break;
      }
    }
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    suppress = true; setTimeout(function () { suppress = false; }, 80);
    d.card.classList.remove('dragging'); d.card.style.transform = '';
    if (d.over) d.over.classList.remove('dropto');
    if (d.moved && d.over && e.type === 'pointerup') {
      var o = find(d.over.getAttribute('data-id')), rows = list(), k = rows.indexOf(d.n), t = rows.indexOf(o);
      if (o && k >= 0 && t >= 0) {
        snap();
        state.notes.splice(state.notes.indexOf(d.n), 1);
        var ib = state.notes.indexOf(o);
        state.notes.splice(t > k ? ib + 1 : ib, 0, d.n);
        state.flash = d.n.id; save(); renderBoard();
      }
    }
  }
  board.addEventListener('pointerup', endDrag);
  board.addEventListener('pointercancel', endDrag);

  /* ---------- Annuler, export/import ---------- */
  var stack = [], typing = false;
  function snap() { stack.push(JSON.stringify({ n: state.notes, f: state.folders })); if (stack.length > 50) stack.shift(); $('undo').disabled = false; }
  function undo() {
    if (!stack.length) return;
    var o = JSON.parse(stack.pop());
    state.notes = o.n.map(norm); state.folders = o.f;
    if (state.sel && state.sel !== '_none' && state.sel !== '_trash' && !curF()) state.sel = '';
    fixF(); $('undo').disabled = !stack.length;
    save(); renderAll();
  }
  $('undo').addEventListener('click', undo);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && Object.keys(state.open).length && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) { state.open = {}; renderBoard(); return; }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) { e.preventDefault(); undo(); }
  });
  $('exp').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify({ app: 'mes-notes', version: 2, notes: state.notes, folders: state.folders }, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'mes-notes-' + today() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    lsSet('mes-notes-lastexp', today()); backup();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  });
  $('imp').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result), arr = Array.isArray(d) ? d : d.notes;
        if (!Array.isArray(arr)) throw 0;
        snap();
        (Array.isArray(d.folders) ? d.folders : []).forEach(function (fo) { if (fo && fo.id && !fold(fo.id)) state.folders.push({ id: fo.id, name: fo.name || 'Pochette' }); });
        arr.map(norm).forEach(function (x) { var cur = find(x.id); if (cur) state.notes[state.notes.indexOf(cur)] = x; else state.notes.push(x); });
        fixF(); save(); renderAll();
      } catch (x) { alert('Fichier invalide.'); }
    };
    rd.readAsText(f); e.target.value = '';
  });

  /* Icône + manifeste */
  try {
    var cv = document.createElement('canvas'); cv.width = cv.height = 180;
    var cx = cv.getContext('2d');
    cx.fillStyle = '#2456d6'; cx.fillRect(0, 0, 180, 180);
    cx.beginPath(); cx.roundRect ? cx.roundRect(34, 26, 88, 128, 9) : cx.rect(34, 26, 88, 128);
    cx.fillStyle = '#fff'; cx.fill();
    cx.strokeStyle = '#b8c4d8'; cx.lineWidth = 5; cx.lineCap = 'round';
    [58, 78, 98, 118].forEach(function (y) { cx.beginPath(); cx.moveTo(50, y); cx.lineTo(106, y); cx.stroke(); });
    cx.save(); cx.translate(124, 116); cx.rotate(-Math.PI / 4);
    cx.lineJoin = 'round'; cx.strokeStyle = '#2456d6'; cx.lineWidth = 6;
    cx.beginPath(); cx.moveTo(-36, 0); cx.lineTo(-12, -10); cx.lineTo(46, -10); cx.lineTo(46, 10); cx.lineTo(-12, 10); cx.closePath(); cx.stroke();
    cx.fillStyle = '#ffc933'; cx.fillRect(-12, -10, 48, 20);
    cx.fillStyle = '#ff7a8a'; cx.fillRect(36, -10, 10, 20);
    cx.fillStyle = '#f3d2a2'; cx.beginPath(); cx.moveTo(-36, 0); cx.lineTo(-12, -10); cx.lineTo(-12, 10); cx.closePath(); cx.fill();
    cx.fillStyle = '#333'; cx.beginPath(); cx.moveTo(-36, 0); cx.lineTo(-27, -3.7); cx.lineTo(-27, 3.7); cx.closePath(); cx.fill();
    cx.restore();
    var ic180 = cv.toDataURL('image/png');
    $('ati').href = ic180;
    var big = document.createElement('canvas'); big.width = big.height = 512;
    var bx = big.getContext('2d'); bx.imageSmoothingQuality = 'high'; bx.drawImage(cv, 0, 0, 512, 512);
    var ic512 = big.toDataURL('image/png');
    var lk = document.createElement('link'); lk.rel = 'icon'; lk.href = ic180; document.head.appendChild(lk);
    var mf = { name: 'Mes Tâches', short_name: 'Tâches', display: 'standalone', orientation: 'any', background_color: '#e9edf2', theme_color: '#2456d6', start_url: location.href.split('#')[0],
      icons: [{ src: ic180, sizes: '180x180', type: 'image/png' }, { src: ic512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
    var ml = document.createElement('link'); ml.rel = 'manifest';
    ml.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(ml);
  } catch (x) {}

  /* Rappels */
  var remOff = '';
  function remind() {
    var t = today();
    var due = state.notes.filter(function (n) { return !n.trashed && !n.done && n.due && n.due <= t; });
    var late = due.filter(function (n) { return n.due < t; }).length, now = due.length - late;
    var box = $('rem');
    var on = lsGet('mes-notes-remon') !== '0';
    try { $('rmd').textContent = on ? '🔔 Rappels : activés' : '🔕 Rappels : désactivés'; } catch (e) {}
    if (!on || !due.length || remOff === t) { box.hidden = true; }
    else {
      var names = due.slice(0, 3).map(function (n) { return n.title || 'Sans titre'; }).join(', ') + (due.length > 3 ? '…' : '');
      $('remtxt').textContent = (now ? now + " pour aujourd'hui" : '') + (now && late ? ' · ' : '') + (late ? late + ' en retard' : '') + ' : ' + names;
      box.hidden = false;
    }
  }
  $('rmd').addEventListener('click', function () {
    var on = lsGet('mes-notes-remon') !== '0';
    lsSet('mes-notes-remon', on ? '0' : '1');
    remOff = '';
    remind();
  });
  $('remx').addEventListener('click', function () { remOff = today(); $('rem').hidden = true; });
  function tick() { if (autoUrgent()) renderAll(); else remind(); backup(); }
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });

  /* Rappel de sauvegarde */
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function daysSince(iso) { var p = iso.split('-'); return Math.floor((new Date(today().split('-')[0], today().split('-')[1] - 1, today().split('-')[2]) - new Date(+p[0], +p[1] - 1, +p[2])) / 86400000); }
  function backup() {
    var t = today(), box = $('bk');
    if (!lsGet('mes-notes-since')) lsSet('mes-notes-since', t);
    var last = lsGet('mes-notes-lastexp'), ref = last || lsGet('mes-notes-since'), d = daysSince(ref);
    var has = state.notes.some(function (n) { return !n.trashed; });
    if (!has || d < 7 || lsGet('mes-notes-bkoff') === t) { box.hidden = true; return; }
    $('bktxt').textContent = last ? 'Dernière sauvegarde il y a ' + d + ' jours.' : 'Tu n\'as jamais sauvegardé tes fiches.';
    box.hidden = false;
  }
  $('bkx').addEventListener('click', function () { lsSet('mes-notes-bkoff', today()); $('bk').hidden = true; });
  $('bkgo').addEventListener('click', function () { $('exp').click(); });

  /* Nombre de colonnes (1 ou 2) selon la largeur du tableau */
  function relayout() { if (colCount() !== lastCols) renderBoard(); fit($('wBody')); }
  if ('ResizeObserver' in window) new ResizeObserver(relayout).observe($('board')); else window.addEventListener('resize', relayout);

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.menuwrap')) $('menu').hidden = true;
    var bt = e.target.closest && e.target.closest('.btn'); if (!bt) return;
    bt.classList.add('lit'); setTimeout(function () { bt.classList.remove('lit'); }, 350);
  });

  load();
  fillWrite();
  renderAll();
  backup();
})();
</script>
</body></html>
